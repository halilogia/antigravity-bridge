[package]
name = "antigravity-bridge"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
futures-util = "0.3.34"
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
tower-http = { version = "0.7.1", features = ["trace", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Console", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem"] }
